function renderRevenue(){
  const all = revVisits();
  const cur = ymShift(REV_OFFSET), prev = ymShift(REV_OFFSET + 1);
  const inM  = all.filter(v => v.ym === cur.ym);
  const inP  = all.filter(v => v.ym === prev.ym);
  const sum  = a => a.reduce((s,v) => s + v.paid, 0);
  const rev = sum(inM), revP = sum(inP);
  const known = inM.filter(v => v.known && v.base > 0);
  const avg = new Set(known.map(v => v.key + '|' + v.day)).size
    ? rev / new Set(known.map(v => v.key + '|' + v.day)).size : 0;   // чек за визит, а не за процедуру
  const clients = new Set(inM.map(v => v.key)).size;
  const visitDays = new Set(inM.map(v => v.key + '|' + v.day)).size;   // приход = один визит
  const fresh = inM.filter(v => v.first).length;
  const disc = inM.reduce((s,v) => s + v.disc, 0);
  const unknown = inM.filter(v => !v.known).length;
  const cost = inM.reduce((s,v) => s + v.cost, 0);
  const profit = rev - cost;
  const costKnown = inM.filter(v => v.costKnown).length;
  const margin = rev > 0 ? Math.round(profit / rev * 100) : 0;

  let delta = '';
  if (revP > 0) {
    const d = Math.round((rev - revP) / revP * 100);
    delta = `<span class="rv-delta ${d >= 0 ? 'up' : 'down'}">${d >= 0 ? '+' : ''}${d}% к ${MONTHS_DAT[prev.m]}</span>`;
  }

  // по процедурам
  const byCat = {};
  inM.forEach(v => { const b = byCat[v.cat] = byCat[v.cat] || { n:0, s:0, unk:0 }; b.n++; b.s += v.paid; if (!v.known) b.unk++; });
  const cats = Object.entries(byCat).sort((a,b) => b[1].s - a[1].s || b[1].n - a[1].n);
  const maxS = Math.max(1, ...cats.map(([,b]) => b.s));

  // полгода
  inM.forEach((v, i) => v._i = i);
  const shown = (REV_CAT ? inM.filter(v => v.cat === REV_CAT) : inM)
    .slice().sort((a,b) => a.date.localeCompare(b.date));

  // Откуда пришли клиенты: выручка за всё время, число людей и доля вернувшихся
  const bySrc = {};
  (CLIENTS || []).forEach(c => {
    const src = String(c.source || '').trim();
    if (!src) return;
    const b = bySrc[src] = bySrc[src] || { name: src, clients: 0, back: 0, rev: 0 };
    b.clients++;
    if (c.visits_count > 1) b.back++;
    b.rev += all.filter(v => v.key === c.key).reduce((s, v) => s + v.paid, 0);
  });
  const srcRows = Object.values(bySrc)
    .map(s => ({ ...s, backPct: s.clients ? Math.round(s.back / s.clients * 100) : 0 }))
    .sort((a,b) => b.rev - a.rev);

  const months = [5,4,3,2,1,0].map(o => { const m = ymShift(REV_OFFSET + o);
    return { ...m, s: sum(all.filter(v => v.ym === m.ym)), on: o === 0 }; });
  const maxM = Math.max(1, ...months.map(m => m.s));

  document.getElementById('rMain').innerHTML = `
    <div class="rv-nav">
      <button type="button" id="rvPrev" aria-label="Предыдущий месяц">‹</button>
      <b>${MONTHS_NOM[cur.m]} ${cur.y}</b>
      <button type="button" id="rvNext" aria-label="Следующий месяц" ${REV_OFFSET === 0 ? 'disabled' : ''}>›</button>
    </div>
    <div class="rv-hero"><span>Выручка за месяц</span><b>${rub(rev)}</b>${delta}</div>
    <div class="rv-profit">
      <div><span>Расходники</span><b>− ${rub(cost)}</b></div>
      <div class="pr"><span>Прибыль</span><b>${rub(profit)}</b><i>${rev > 0 ? margin + '% от выручки' : ''}</i></div>
    </div>
    <div class="sum">
      <div class="sum-card"><b>${visitDays}</b><span>${plural(visitDays,'визит','визита','визитов')}, процедур ${inM.length}</span></div>
      <div class="sum-card"><b>${known.length ? rub(avg) : '—'}</b><span>средний чек</span></div>
      <div class="sum-card"><b>${clients}</b><span>${plural(clients,'клиент','клиента','клиентов')}, новых ${fresh}</span></div>
      <div class="sum-card"><b>${rub(disc)}</b><span>скидки по картам</span></div>
    </div>
    ${cats.length ? `<div class="sh-block"><h4>По процедурам — нажмите, чтобы посмотреть визиты</h4>${cats.map(([k,b]) => `
      <button type="button" class="rv-cat${REV_CAT === k ? ' on' : ''}" data-cat="${k}">
        <div class="rv-cat-top"><span>${esc(CAT_TITLE[k] || k)} <i>· ${b.n}</i></span><span>${b.s ? rub(b.s) : (b.unk ? '<i>без цены</i>' : rub(0))}</span></div>
        <div class="rv-bar"><div style="width:${Math.max(3, b.s / maxS * 100)}%"></div></div></button>`).join('')}</div>`
      : '<div class="state" style="padding:20px 8px"><b>Визитов нет</b>В этом месяце отмеченных визитов нет.</div>'}
    ${srcRows.length ? `<div class="sh-block"><h4>Откуда пришли клиенты · за всё время</h4>
      ${srcRows.map(s => `<div class="rv-src">
        <b>${esc(s.name)}</b>
        <i>${s.clients} ${plural(s.clients,'клиент','клиента','клиентов')} · вернулись ${s.backPct}%</i>
        <span>${rub(s.rev)}</span></div>`).join('')}
      <p class="sh-note" style="margin:10px 0 0">Считается по колонке «источник» в визитах — она заполняется при отметке новых клиентов. «Вернулись» — доля тех, кто пришёл больше одного раза.</p>
    </div>` : ''}
    <div class="sh-block"><h4>Последние полгода</h4>
      <div class="rv-chart">${months.map(m => `
        <div class="rv-col${m.on ? ' on' : ''}"><em>${m.s ? Math.round(m.s/1000) + 'к' : ''}</em>
          <div class="rv-colbar" style="height:${m.s ? Math.max(4, m.s / maxM * 100) : 0}%"></div>
          <span>${MONTHS_SH[m.m]}</span></div>`).join('')}</div></div>
    <div class="sh-block">
      <h4>${REV_CAT ? `Визиты: ${esc(CAT_TITLE[REV_CAT] || REV_CAT)}` : 'Все визиты за месяц'} · ${shown.length}
        ${REV_CAT ? '<button type="button" id="rvAll" class="rv-clear">показать все</button>' : ''}</h4>
      ${shown.length ? shown.map((v, i) => `
        <button type="button" class="rv-visit" data-i="${v._i}">
          <span class="rv-when">${fmtShort(v.date)}</span>
          <span class="rv-who"><b>${esc(v.who)}</b><i>${splitSvc(v.service).map(s => esc(s)).join('<br>')}</i></span>
          <span class="rv-sum">${v.known ? rub(v.paid) : '—'}${v.own ? '<span class="own">✎</span>' : ''}</span>
        </button>`).join('') : '<p class="sh-note" style="margin:0">Визитов нет</p>'}
    </div>
    ${unknown ? `<p class="sh-note">${unknown} ${plural(unknown,'визит','визита','визитов')} без распознанной процедуры — в суммы не ${unknown === 1 ? 'вошёл' : 'вошли'}.</p>` : ''}`;

  document.getElementById('rvPrev').onclick = () => { REV_OFFSET++; REV_CAT = null; renderRevenue(); };
  document.getElementById('rvNext').onclick = () => { if (REV_OFFSET > 0) { REV_OFFSET--; REV_CAT = null; renderRevenue(); } };
  document.querySelectorAll('.rv-cat[data-cat]').forEach(b => b.onclick = () => {
    REV_CAT = (REV_CAT === b.dataset.cat) ? null : b.dataset.cat; renderRevenue();
  });
  const clr = document.getElementById('rvAll'); if (clr) clr.onclick = () => { REV_CAT = null; renderRevenue(); };
  document.querySelectorAll('.rv-visit[data-i]').forEach(b => b.onclick = () => openVisitEdit(inM[+b.dataset.i]));
}
document.getElementById('sheetBg').addEventListener('click', e => { if (e.target.id === 'sheetBg') closeClient(); });

// Открыть сразу нужную вкладку: admin.html?tab=clients
{ const t0 = new URLSearchParams(location.search).get('tab'); if (t0 === 'clients' || t0 === 'revenue') showTab(t0); }
</script>
</body>
</html>
